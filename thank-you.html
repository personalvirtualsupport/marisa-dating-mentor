<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank You | Jewish Dating Mentor</title>
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --plum: #5c2b47;
  --plum-dark: #3d1a30;
  --cream: #fdf6ee;
  --cream-mid: #f5e8d4;
  --gold: #c9952a;
  --white: #ffffff;
  --text: #2d1a20;
  --text-mid: #6b4050;
  --border: #e8d4c8;
}
body {
  min-height: 100vh;
  background: var(--cream);
  color: var(--text);
  font-family: 'Lora', serif;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 32px;
  line-height: 1.85;
}
.thank-you-card {
  max-width: 700px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 56px 44px;
  box-shadow: 0 8px 30px rgba(92,43,71,0.08);
}
.star {
  color: var(--gold);
  font-size: 2.2rem;
  margin-bottom: 18px;
}
h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2.4rem, 5vw, 3.4rem);
  font-weight: 300;
  color: var(--plum);
  margin-bottom: 22px;
  line-height: 1.2;
}
p {
  font-size: 1.06rem;
  line-height: 1.9;
  color: var(--text-mid);
  margin-bottom: 18px;
}
.blessing {
  margin: 28px auto 0;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.45rem;
  line-height: 1.65;
  color: var(--plum);
}
.signature {
  font-family: 'Great Vibes', cursive;
  font-size: 2.4rem;
  color: var(--plum-dark);
  margin-top: 8px;
}
a {
  display: inline-block;
  margin-top: 30px;
  background: var(--plum);
  color: var(--cream-mid);
  text-decoration: none;
  padding: 14px 34px;
  border-radius: 50px;
  font-size: 0.88rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  box-shadow: 0 4px 18px rgba(92,43,71,0.18);
}
a:hover { background: var(--plum-dark); }
@media (max-width: 600px) {
  body { padding: 20px; }
  .thank-you-card { padding: 42px 24px; }
  .blessing { font-size: 1.28rem; }
}
</style>
</head>
<body>
  <main class="thank-you-card">
    <div class="star" aria-hidden="true">✦</div>
    <h1>Thank you for reaching out</h1>
    <p>Your message has been sent successfully.</p>
    <p>I will read it with care and be in touch with you soon.</p>
    <p class="blessing">Wishing you clarity in your decisions, confidence in your journey, and the joy of finding your zivug b'sha'ah tovah.</p>
    <div class="signature">Marisa</div>
    <a href="/">Return to website</a>
  </main>
</body>
</html>
